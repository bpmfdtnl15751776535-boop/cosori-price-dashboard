name: COSORI 每日价格更新

# 仅在周末执行：UTC 01:00 = 北京时间 09:00（周六、周日）
# 工作日由本地电脑上的 WorkBuddy 自动化采集
on:
  schedule:
    - cron: '0 1 * * 6,0'
  workflow_dispatch:

concurrency:
  group: cosori-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 使用 Playwright 自带的 Chromium，避免依赖本机 Chrome
  COSORI_BROWSER: chromium
  # 飞书用户凭证回写开关（可选），见下方步骤
  GH_PAT_CHECK: ${{ secrets.GH_PAT }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖与浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 恢复飞书用户凭证
        env:
          FEISHU_USER_TOKEN_JSON: ${{ secrets.FEISHU_USER_TOKEN_JSON }}
        run: |
          if [ -n "$FEISHU_USER_TOKEN_JSON" ]; then
            printf '%s' "$FEISHU_USER_TOKEN_JSON" > feishu_user_token.json
            echo "已写入飞书用户凭证"
          else
            echo "未配置 FEISHU_USER_TOKEN_JSON，多维表格写入将跳过"
          fi

      - name: 采集三平台价格
        env:
          COSORI_PROXY: ${{ secrets.COSORI_PROXY }}
          HTTPS_PROXY: ${{ secrets.COSORI_PROXY }}
          HTTP_PROXY: ${{ secrets.COSORI_PROXY }}
        # 云端无代理时 WB/Ozon 会被反爬拦截，多抓几页 Yandex 作为补偿
        run: python scraper.py --pages 4

      - name: 合并 Ozon Seller 数据（只读）
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          NO_PROXY: '*'
        run: |
          if [ -n "$OZON_CLIENT_ID" ] && [ -n "$OZON_API_KEY" ]; then
            python ozon_seller.py --merge
          else
            echo "缺少 OZON_CLIENT_ID / OZON_API_KEY，跳过 Ozon Seller 合并"
          fi

      - name: 补全 Wildberries 店铺名
        env:
          COSORI_PROXY: ${{ secrets.COSORI_PROXY }}
          HTTPS_PROXY: ${{ secrets.COSORI_PROXY }}
          HTTP_PROXY: ${{ secrets.COSORI_PROXY }}
        run: python enrich_shops.py

      - name: 统计有效商品
        id: count
        run: |
          VALID=$(python -c "import json;d=json.load(open('data/products.json',encoding='utf-8'));print(sum(1 for p in d['products'] if p['status']=='ok' and p.get('price')))")
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"
          echo "有效商品：$VALID 条"

      - name: 准备静态站点目录
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false

      - name: 推送飞书表格与群卡片
        if: steps.count.outputs.valid != '0'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python push_feishu.py --mode both

      - name: 回写刷新后的飞书用户凭证（可选）
        if: steps.count.outputs.valid != '0' && env.GH_PAT_CHECK != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set FEISHU_USER_TOKEN_JSON --body "$(cat feishu_user_token.json)" -R "$GITHUB_REPOSITORY" || echo "凭证回写失败，请在重新 OAuth 后手动更新 Secret"
