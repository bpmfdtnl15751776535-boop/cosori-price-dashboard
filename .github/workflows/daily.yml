name: COSORI 每日价格更新

# 仅在周末执行：UTC 01:00 = 北京时间 09:00（周六、周日）
# 工作日由本地电脑上的 WorkBuddy 自动化采集
on:
  schedule:
    - cron: '0 1 * * 6,0'
  workflow_dispatch:

concurrency:
  group: cosori-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 使用 Playwright 自带的 Chromium，避免依赖本机 Chrome
  COSORI_BROWSER: chromium

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖与浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 采集三平台价格
        # 实测：住宅代理对 WB 有害（498）、对 Ozon 无效（403），裸连反而 WB/Yandex 正常。
        # 因此不注入任何代理；云端 WB 若被机房 IP 拦截，由 last_good.json 补位。
        # 多抓几页 Yandex 作为补偿。
        run: python scraper.py --pages 4

      - name: 合并 Ozon Seller 数据（只读）
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          NO_PROXY: '*'
        run: |
          if [ -n "$OZON_CLIENT_ID" ] && [ -n "$OZON_API_KEY" ]; then
            python ozon_seller.py --merge
          else
            echo "缺少 OZON_CLIENT_ID / OZON_API_KEY，跳过 Ozon Seller 合并"
          fi

      - name: 补全 Wildberries 店铺名
        run: python enrich_shops.py

      - name: 统计有效商品
        id: count
        run: |
          VALID=$(python -c "import json;d=json.load(open('data/products.json',encoding='utf-8'));print(sum(1 for p in d['products'] if p['status']=='ok' and p.get('price')))")
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"
          echo "有效商品：$VALID 条"

      - name: 准备静态站点目录
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false

      # 云端只推群卡片（webhook 即可，不需要用户凭证）；
      # 多维表格由工作日本地电脑写入，避免本地与云端争用一次性 refresh_token
      - name: 推送飞书群卡片
        if: steps.count.outputs.valid != '0'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python push_feishu.py --mode card
